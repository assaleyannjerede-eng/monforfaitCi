<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="gILjCPLc9mQR9Ua5Jz_b1w-JbyBhaiIvhDyJ0JBjPpg" />
  <title>MonForfait.ci - Inscription</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="container">
    <div class="card">
     
      <img src="img/logo.png" class="logo" alt="Logo MonForfait">
      <h1>Créer un compte</h1>

      
      <input type="text"     id="name"     placeholder="Nom complet">
      <input type="text"     id="phone"    placeholder="+225 0101010101">
      <input type="email"    id="email"    placeholder="Email">
      <input type="password" id="password" placeholder="Mot de passe (min 8 caractères)">
<div
  class="h-captcha"
  data-sitekey="79849334-5e9c-482e-9d6a-971e557e7a88"
  data-callback="onHCaptchaSuccess"
  data-expired-callback="onHCaptchaExpired"
  data-error-callback="onHCaptchaError">
</div>
     
      <button id="registerBtn">S'inscrire</button>

      <p>Déjà inscrit ? <a href="index.html">Connexion</a></p>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0"></script>
  <script src="js/supabase.js"></script>
  
  <script src="js/forfaits.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  
  <script src="js/app.js"></script>
</body>
</html>
